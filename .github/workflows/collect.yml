name: collect-live

on:
  schedule:
    - cron: "7 0 * * *"   # 매일 09:07 KST (00:07 UTC), 하루 한 번
  workflow_dispatch: {}    # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: collect-live
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 공개 fixture 계약 검사
        run: node scripts/selftest.mjs
      - name: 실제 공개 원천 조회 후 저장
        run: node scripts/collect.mjs
      - name: 저장 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/live-state.json
          git diff --cached --quiet || git commit -m "live: $(TZ=Asia/Seoul date +%F) 조회 결과"
          git push
